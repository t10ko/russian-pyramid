name: Build macOS app

on:
  workflow_call:
    inputs:
      ref:
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build .app with PyInstaller
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$ARCH"
          packaging/build_macos.sh

      - name: Create and verify disk image
        run: packaging/package_macos.sh

      - name: Smoke test the app on the disk image
        env:
          ARCH: ${{ matrix.arch }}
          BUILD_REF: ${{ inputs.ref || github.ref }}
        run: |
          mountpoint="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "packaging/dist/russian-pyramid-$ARCH.dmg"
          trap 'hdiutil detach "$mountpoint"' EXIT
          test "$(readlink "$mountpoint/Applications")" = /Applications
          app="$mountpoint/Russian Pyramid.app"
          codesign --verify --deep --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/Russian Pyramid")" = "$ARCH"
          server="$app/Contents/MacOS/russian-pyramid"
          version="$("$server" --version | tail -n 1)"
          if [[ "$BUILD_REF" == refs/tags/* ]]; then
            tag="${BUILD_REF#refs/tags/}"
            test "$version" = "russian-pyramid ${tag#v}"
          fi
          "$server" --no-browser --port 8123 > "$RUNNER_TEMP/practice-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; hdiutil detach "$mountpoint"' EXIT
          for attempt in {1..90}; do
            curl -fs --max-time 2 http://127.0.0.1:8123/api/state -o /dev/null && break
            kill -0 "$server_pid" 2>/dev/null || break
            sleep 1
          done
          cat "$RUNNER_TEMP/practice-server.log"
          curl -fsS --max-time 10 http://127.0.0.1:8123/ -o /dev/null
          curl -fsS --max-time 90 http://127.0.0.1:8123/api/shoot \
            -H 'Content-Type: application/json' -d '{"params":{"V0":2.0,"phi":90.0}}' -o /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: russian-pyramid-${{ matrix.arch }}
          path: packaging/dist/russian-pyramid-${{ matrix.arch }}.dmg
          if-no-files-found: error
          compression-level: 0
