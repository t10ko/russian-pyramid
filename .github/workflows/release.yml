name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-app.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - name: Generate installer checksums
        working-directory: dist
        run: sha256sum russian-pyramid-arm64.dmg russian-pyramid-x86_64.dmg > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/russian-pyramid-arm64.dmg
            dist/russian-pyramid-x86_64.dmg
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          body: |
            ### Install via Homebrew (Recommended — no Gatekeeper prompt)

            ```bash
            brew tap t10ko/tap && brew trust t10ko/tap
            brew install --cask t10ko/tap/russian-pyramid
            ```

            ### Manual `.dmg` Download

            Download `russian-pyramid-arm64.dmg` for an Apple Silicon Mac or `russian-pyramid-x86_64.dmg` for an Intel Mac. Open the disk image and drag **Russian Pyramid** into **Applications**.

            This release is distributed without Apple notarization. If macOS blocks a browser-downloaded `.dmg` on first launch, run `xattr -dr com.apple.quarantine "/Applications/Russian Pyramid.app"` or use **Open Anyway** ([Apple’s instructions](https://support.apple.com/en-us/102445)).
          generate_release_notes: true

      - name: Update Homebrew Cask tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN secret not set; skipping automatic t10ko/homebrew-tap update."
            exit 0
          fi
          VERSION="${TAG#v}"
          ARM_SHA="$(awk '/russian-pyramid-arm64\.dmg$/ {print $1}' dist/SHA256SUMS)"
          INTEL_SHA="$(awk '/russian-pyramid-x86_64\.dmg$/ {print $1}' dist/SHA256SUMS)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/t10ko/homebrew-tap.git" /tmp/tap
          sed -i -E \
            -e "s/version \"[^\"]+\"/version \"${VERSION}\"/" \
            -e "s/arm: +\"[0-9a-f]+\"/arm:   \"${ARM_SHA}\"/" \
            -e "s/intel: +\"[0-9a-f]+\"/intel: \"${INTEL_SHA}\"/" \
            /tmp/tap/Casks/russian-pyramid.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/russian-pyramid.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore(cask): bump russian-pyramid to ${VERSION}"
            git push
          fi
